<!doctype html><html><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Admin Dashboard</title>
<style>body{background:#0b1424;color:#eaf1fa;font-family:Arial;padding:20px}.panel{background:#142238;padding:16px;border-radius:12px;margin:14px auto;max-width:1100px}input{padding:10px}button{padding:10px;background:#287bd0;color:white;border:0;border-radius:7px}table{width:100%;border-collapse:collapse;font-size:12px}td,th{padding:9px;border-bottom:1px solid #334;text-align:left}.muted{color:#aabbd0}</style>
<div class="panel"><h1>Cyber Security Demo — Admin Dashboard</h1><p class="muted">Consent-based sessions • Simulation only</p><input id="key" type="password" placeholder="Admin key"><button onclick="loadRows()">Load / Refresh</button><p id="url"></p></div>
<div class="panel"><h2>Participants</h2><div style="overflow:auto"><table><thead><tr><th>Time</th><th>Session</th><th>Platform</th><th>Browser</th><th>Language / Time Zone</th><th>Screen</th><th>Location</th></tr></thead><tbody id="body"></tbody></table></div></div>
<script>document.getElementById('url').textContent='Participant link: '+location.origin+'/';async function loadRows(){let r=await fetch('/api/sessions',{headers:{'X-Admin-Key':document.getElementById('key').value}});if(!r.ok){alert('Admin key incorrect');return}let a=await r.json(),b=document.getElementById('body');b.replaceChildren();a.reverse().forEach(x=>{let tr=document.createElement('tr');[x.time,x.sessionId,x.platform,x.browser,(x.language||'')+' / '+(x.timezone||''),x.screen,x.location?x.location.latitude+', '+x.location.longitude:'Not shared'].forEach(v=>{let td=document.createElement('td');td.textContent=v||'—';tr.append(td)});b.append(tr)})}</script></html>
